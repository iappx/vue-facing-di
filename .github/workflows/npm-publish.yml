# Publishing uses npm Trusted Publishing (OIDC) — no npm token/secret is required.
# See https://docs.npmjs.com/trusted-publishers

name: Publish

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@iappx/vue-facing-di@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing requires npm >= 11.5.1; Node 22 ships an older npm.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --ignore-scripts
